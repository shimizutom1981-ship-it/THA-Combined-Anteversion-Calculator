<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THA カップ前捻角・透視投影像シミュレーター</title>
  <style>
    :root {
      --primary: #1e40af;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --panel-bg: #000000;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --ellipse-color: #38bdf8;
      --axis-color: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: var(--card-bg);
      max-width: 520px;
      width: 100%;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 4px 0;
      color: var(--accent);
      text-align: center;
    }
    p.subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .side-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .side-selector button {
      flex: 1;
      padding: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: #334155;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }
    .side-selector button.active {
      background-color: var(--primary);
      border-color: var(--accent);
      color: #ffffff;
    }
    .grid-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 8px;
    }
    .input-wrapper:focus-within {
      border-color: var(--accent);
    }
    input[type="number"] {
      width: 100%;
      padding: 8px 4px;
      font-size: 1rem;
      background: transparent;
      border: none;
      color: #ffffff;
      outline: none;
    }
    .unit {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .results-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .res-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .res-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .res-val {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }
    /* 透視ビュー */
    .viewer-panel {
      background-color: var(--panel-bg);
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .viewer-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    svg {
      width: 280px;
      height: 280px;
      background-color: #000000;
    }
    .meta-text {
      font-size: 0.75rem;
      color: #cbd5e1;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>THA 透視投影像・カップ前捻角</h1>
  <p class="subtitle">Widmer理論 ＋ 骨盤動態補正 ＋ 透視楕円幾何モデル</p>

  <div class="side-selector">
    <button id="btnRight" class="active" type="button" onclick="setSide('right')">右 股関節 (Right)</button>
    <button id="btnLeft" type="button" onclick="setSide('left')">左 股関節 (Left)</button>
  </div>

  <div class="grid-inputs">
    <div class="input-group">
      <label for="stemAnte">頸部・ステム前捻角 (V_stem)</label>
      <div class="input-wrapper">
        <input type="number" id="stemAnte" step="0.5" value="15.0">
        <span class="unit">°</span>
      </div>
    </div>
    <div class="input-group">
      <label for="deltaPT">骨盤後傾変化量 (ΔPT)</label>
      <div class="input-wrapper">
        <input type="number" id="deltaPT" step="0.5" value="10.0">
        <span class="unit">°</span>
      </div>
    </div>
    <div class="input-group">
      <label for="cupInc">カップ外方傾斜角 (Inclination)</label>
      <div class="input-wrapper">
        <input type="number" id="cupInc" step="1.0" value="40.0">
        <span class="unit">°</span>
      </div>
    </div>
    <div class="input-group">
      <label for="headSize">描画参照外径</label>
      <div class="input-wrapper">
        <input type="number" id="headSize" step="1" value="50" disabled>
        <span class="unit">mm</span>
      </div>
    </div>
  </div>

  <div class="results-row">
    <div class="res-box">
      <div class="res-title">目標カップ前捻角 (V_cup)</div>
      <div class="res-val"><span id="targetCupAnte">--</span><span style="font-size:1rem;">°</span></div>
    </div>
    <div class="res-box">
      <div class="res-title">透視見かけ傾斜角 (Apparent Inc)</div>
      <div class="res-val"><span id="apparentInc">--</span><span style="font-size:1rem;">°</span></div>
    </div>
  </div>

  <div class="viewer-panel">
    <div class="viewer-header">
      <span id="viewSideLabel">イメージ正面像: 右股関節</span>
      <span>Center Beam 垂直投影</span>
    </div>
    <svg id="fluoroSvg" viewBox="-120 -120 240 240">
      <!-- 座標軸グリッド（写真同様） -->
      <line x1="-110" y1="0" x2="110" y2="0" stroke="#1e293b" stroke-width="1"/>
      <line x1="0" y1="-110" x2="0" y2="110" stroke="#1e293b" stroke-width="1"/>
      <circle cx="0" cy="0" r="100" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2"/>

      <!-- カップ半球背景（ドーム） -->
      <path id="cupDome" fill="rgba(56, 189, 248, 0.15)" stroke="#0284c7" stroke-width="1.5" />

      <!-- 開口面楕円（フェイス） -->
      <ellipse id="cupEllipse" cx="0" cy="0" rx="90" ry="30" fill="rgba(56, 189, 248, 0.3)" stroke="#38bdf8" stroke-width="2.5" />

      <!-- 長軸ライン（写真の赤線に相当） -->
      <line id="majorAxisLine" x1="-90" y1="0" x2="90" y2="0" stroke="#ef4444" stroke-width="2" />
    </svg>
    <div class="meta-text" id="ellipseParams">長軸径: 90px | 短軸比: --</div>
  </div>
</div>

<script>
  let currentSide = 'right';

  const stemInput = document.getElementById('stemAnte');
  const ptInput = document.getElementById('deltaPT');
  const incInput = document.getElementById('cupInc');

  const targetCupAnteDisp = document.getElementById('targetCupAnte');
  const apparentIncDisp = document.getElementById('apparentInc');
  const viewSideLabel = document.getElementById('viewSideLabel');
  const ellipseParamsDisp = document.getElementById('ellipseParams');

  const cupEllipse = document.getElementById('cupEllipse');
  const majorAxisLine = document.getElementById('majorAxisLine');
  const cupDome = document.getElementById('cupDome');

  function setSide(side) {
    currentSide = side;
    document.getElementById('btnRight').classList.toggle('active', side === 'right');
    document.getElementById('btnLeft').classList.toggle('active', side === 'left');
    viewSideLabel.textContent = `イメージ正面像: ${side === 'right' ? '右股関節' : '左股関節'}`;
    update();
  }

  function update() {
    const vStem = parseFloat(stemInput.value) || 0;
    const deltaPT = parseFloat(ptInput.value) || 0;
    const inc = parseFloat(incInput.value) || 40;

    // Widmer + 1/2ルール
    const vCup = 37.3 - (0.7 * vStem) - (deltaPT / 2.0);
    targetCupAnteDisp.textContent = vCup.toFixed(1);

    // 幾何学的投影パラメータの計算
    // 写真モデル: 前捻角(RA)により短軸比 b/a = sin(RA)
    // 見かけの長軸傾斜角 θ: tan(θ) = tan(Inc) * cos(RA)
    const incRad = inc * (Math.PI / 180.0);
    const anteRad = Math.max(0, vCup) * (Math.PI / 180.0);

    const a = 85; // 半径 (px)
    const b = a * Math.sin(anteRad); // 短軸半径

    // 水平に対する見かけの傾斜角 (Apparent Inclination)
    const tanApparent = Math.tan(incRad) * Math.cos(anteRad);
    const apparentIncDeg = Math.atan(tanApparent) * (180.0 / Math.PI);
    apparentIncDisp.textContent = apparentIncDeg.toFixed(1);

    // SVG回転角: 右股関節は時計回り（右下がり）、左股関節は反時計回り（左下がり/右上がり）
    const rotAngle = currentSide === 'right' ? apparentIncDeg : -apparentIncDeg;

    // 楕円属性の更新
    cupEllipse.setAttribute('rx', a);
    cupEllipse.setAttribute('ry', Math.abs(b));
    cupEllipse.setAttribute('transform', `rotate(${rotAngle})`);

    // 長軸ラインの更新
    majorAxisLine.setAttribute('x1', -a);
    majorAxisLine.setAttribute('x2', a);
    majorAxisLine.setAttribute('y1', 0);
    majorAxisLine.setAttribute('y2', 0);
    majorAxisLine.setAttribute('transform', `rotate(${rotAngle})`);

    // カップ半球ドーム（開口部反対側の上外側骨盤側）の描画
    // 上外側に膨らむ円弧パス
    const sweep = currentSide === 'right' ? 1 : 0;
    const domePath = `M ${-a} 0 A ${a} ${a} 0 0 1 ${a} 0`;
    cupDome.setAttribute('d', domePath);
    cupDome.setAttribute('transform', `rotate(${rotAngle + (currentSide === 'right' ? 180 : 180)})`);

    ellipseParamsDisp.textContent = `長軸比(短軸/長軸): ${(Math.sin(anteRad)).toFixed(2)} | 開口傾斜: ${rotAngle.toFixed(1)}°`;
  }

  stemInput.addEventListener('input', update);
  ptInput.addEventListener('input', update);
  incInput.addEventListener('input', update);

  update();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THA カップ前捻角計算・正面像シミュレーター</title>
  <style>
    :root {
      --primary: #1e40af;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --accent: #2563eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: var(--card-bg);
      max-width: 480px;
      width: 100%;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 1.2rem;
      margin-top: 0;
      margin-bottom: 6px;
      color: var(--primary);
    }
    p.subtitle {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 18px;
    }
    .input-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
    }
    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
    .unit {
      font-size: 0.85rem;
      color: #64748b;
      min-width: 20px;
    }
    .result-box {
      margin-top: 18px;
      padding: 12px;
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      text-align: center;
    }
    .result-label {
      font-size: 0.8rem;
      color: #1e40af;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .result-val {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
    }
    .result-unit {
      font-size: 1.1rem;
      margin-left: 2px;
    }
    .preview-container {
      margin-top: 18px;
      text-align: center;
    }
    .preview-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }
    canvas {
      background-color: #0f172a;
      border-radius: 8px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
      display: block;
      margin: 0 auto;
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
    .formula-note {
      margin-top: 18px;
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.5;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>THA カップ前捻角計算 ＆ 正面像表示</h1>
  <p class="subtitle">Widmer理論 ＋ 骨盤動態補正（1/2ルール）</p>

  <div class="input-group">
    <label for="stemAnteversion">大腿骨頸部・ステム前捻角 (V_stem)</label>
    <div class="input-wrapper">
      <input type="number" id="stemAnteversion" step="0.5" value="15.0">
      <span class="unit">°</span>
    </div>
  </div>

  <div class="input-group">
    <label for="deltaPT">骨盤後傾角変化量 (ΔPT: 臥位→立位)</label>
    <div class="input-wrapper">
      <input type="number" id="deltaPT" step="0.5" value="10.0">
      <span class="unit">°</span>
    </div>
  </div>

  <div class="input-group">
    <label for="cupInclination">外方傾斜角 (Inclination: 基準値)</label>
    <div class="input-wrapper">
      <input type="number" id="cupInclination" step="1.0" value="40.0">
      <span class="unit">°</span>
    </div>
  </div>

  <div class="result-box">
    <div class="result-label">目標カップ前方開角 (V_cup)</div>
    <div class="result-val">
      <span id="cupAnteversion">--</span><span class="result-unit">°</span>
    </div>
  </div>

  <!-- レントゲン正面像イメージ描画エリア -->
  <div class="preview-container">
    <div class="preview-title">
      <span>正面X線像（AP像）見え方</span>
      <span id="previewSideText" style="font-size:0.75rem; color:#64748b;">(右股関節)</span>
    </div>
    <canvas id="cupCanvas" width="300" height="240"></canvas>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:#38bdf8;"></div>
        <span>臼蓋カップ開口部（楕円）</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#64748b;"></div>
        <span>半球ドーム輪郭</span>
      </div>
    </div>
  </div>

  <div class="formula-note">
    <strong>計算式:</strong><br>
    V_cup = 37.3° - (0.7 × V_stem) - (ΔPT / 2)<br>
    ※ 投影図は右臼蓋カップを正面（AP）から見た投影像を幾何学的に近似計算して描画しています。前捻角が増加すると開口部楕円の短軸が広がり、前捻角が0°に近づくとスリット状（細長い楕円）に近づきます。
  </div>
</div>

<script>
  const stemInput = document.getElementById('stemAnteversion');
  const ptInput = document.getElementById('deltaPT');
  const incInput = document.getElementById('cupInclination');
  const resultDisplay = document.getElementById('cupAnteversion');
  const canvas = document.getElementById('cupCanvas');
  const ctx = canvas.getContext('2d');

  function calculateAndDraw() {
    const vStem = parseFloat(stemInput.value);
    const deltaPT = parseFloat(ptInput.value);
    let incDeg = parseFloat(incInput.value);

    if (isNaN(incDeg)) incDeg = 40.0;

    if (isNaN(vStem) || isNaN(deltaPT)) {
      resultDisplay.textContent = '--';
      drawEmptyCanvas();
      return;
    }

    // カップ目標前捻角の算出
    const vCup = 37.3 - (0.7 * vStem) - (deltaPT / 2.0);
    resultDisplay.textContent = vCup.toFixed(1);

    // キャンバス描画
    drawCupAPView(incDeg, vCup);
  }

  function drawEmptyCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawCupAPView(inclinationDeg, anteversionDeg) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 背景
    ctx.fillStyle = '#0b1329';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = 70; // カップ外径半径 (px)

    // 角度ラジアン変換
    const incRad = (inclinationDeg * Math.PI) / 180;
    const anteRad = (Math.max(0, anteversionDeg) * Math.PI) / 180;

    // ガイドライン（水平・垂直基準）
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(cx - 100, cy);
    ctx.lineTo(cx + 100, cy);
    ctx.moveTo(cx, cy - 100);
    ctx.lineTo(cx, cy + 100);
    ctx.stroke();
    ctx.setLineDash([]);

    // 正面像での開口部楕円の長軸と短軸比率
    // Liaw et al. / Murrayの幾何学投影像に基づく: 前捻角に伴い短軸 = R * sin(前捻)
    // 傾斜角は水平面に対する傾き
    const majorRadius = radius;
    // 見かけの開口幅（前捻角に応じた短軸の比率）
    const minorRadius = radius * Math.sin(anteRad);

    ctx.save();
    ctx.translate(cx, cy);

    // 右股関節: 外方傾斜角 incRad 分だけ回転 (反時計回り)
    const rotationAngle = - (Math.PI / 2 - incRad);
    ctx.rotate(rotationAngle);

    // 1. カップの半球ドーム（外郭シェル）の描画
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI, false);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
    ctx.lineWidth = 8;
    ctx.stroke();

    // ドーム内側の薄いフィル
    ctx.beginPath();
    ctx.arc(0, 0, radius - 4, 0, Math.PI, false);
    ctx.fillStyle = 'rgba(56, 189, 248, 0.05)';
    ctx.fill();

    // 2. 開口部リム（楕円リング）の描画
    ctx.beginPath();
    ctx.ellipse(0, 0, majorRadius, Math.max(1, minorRadius), 0, 0, 2 * Math.PI);
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3.5;
    ctx.stroke();

    // 楕円内部の半透明ハイライト
    ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
    ctx.fill();

    ctx.restore();

    // 角度テキスト情報
    ctx.fillStyle = '#94a3b8';
    ctx.font = '12px sans-serif';
    ctx.fillText(`Inclination: ${inclinationDeg.toFixed(1)}°`, 14, 24);
    ctx.fillText(`Anteversion: ${anteversionDeg.toFixed(1)}°`, 14, 42);
  }

  stemInput.addEventListener('input', calculateAndDraw);
  ptInput.addEventListener('input', calculateAndDraw);
  incInput.addEventListener('input', calculateAndDraw);

  calculateAndDraw();
</script>

</body>
</html>

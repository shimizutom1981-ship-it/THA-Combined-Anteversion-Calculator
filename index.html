<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>THA カップ設置角・透視写真計測 & 動態シミュレーター</title>

  <style>
    :root {
      --primary: #1e40af;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --panel-bg: #000000;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background-color: var(--bg);
      color: var(--text);

      margin: 0;

      padding-top: max(16px, env(safe-area-inset-top));
      padding-right: max(16px, env(safe-area-inset-right));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));

      display: flex;
      justify-content: center;

      min-height: 100vh;
      min-height: 100dvh;
    }

    button,
    input,
    label {
      font-family: inherit;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
    }

    .container {
      background: var(--card-bg);
      max-width: 580px;
      width: 100%;

      border-radius: 12px;
      padding: 20px;

      box-shadow:
        0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 4px 0;
      color: var(--accent);
      text-align: center;
    }

    p.subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
    }

    /* -------------------------
       タブ
       ------------------------- */

    .tab-container {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 6px;

      background: none;
      border: none;

      color: var(--text-muted);

      font-weight: 700;
      font-size: 0.88rem;

      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* -------------------------
       左右選択
       ------------------------- */

    .side-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .side-selector button {
      flex: 1;

      padding: 10px;

      font-weight: 700;
      font-size: 0.95rem;

      border: 1px solid var(--border);
      border-radius: 6px;

      background-color: #334155;
      color: var(--text);

      cursor: pointer;
    }

    .side-selector button.active {
      background-color: var(--primary);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* -------------------------
       入力
       ------------------------- */

    .grid-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;

      background-color: #0f172a;

      border: 1px solid var(--border);
      border-radius: 6px;

      padding: 0 8px;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;

      padding: 8px 4px;

      font-size: 1rem;

      background: transparent;
      border: none;

      color: #ffffff;

      outline: none;
    }

    .unit {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* -------------------------
       結果
       ------------------------- */

    .results-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .res-box {
      background: #0f172a;

      border: 1px solid var(--border);
      border-radius: 8px;

      padding: 10px;

      text-align: center;
    }

    .res-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .res-val {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* -------------------------
       写真
       ------------------------- */

    .photo-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-input-wrapper {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .btn-action {
      flex: 2;
      min-width: 140px;

      padding: 10px;

      background-color: var(--accent);
      color: #0f172a;

      font-weight: 700;

      border-radius: 6px;

      text-align: center;
      cursor: pointer;

      border: none;

      user-select: none;
      -webkit-user-select: none;
    }

    .btn-reset {
      flex: 1;

      background-color: #475569;
      color: #ffffff;
    }

    /* -------------------------
       ズーム
       ------------------------- */

    .zoom-controls {
      display: flex;
      align-items: center;

      gap: 6px;

      background: #0f172a;

      padding: 6px;

      border-radius: 6px;
      border: 1px solid var(--border);

      flex-wrap: wrap;
    }

    .zoom-btn {
      background: #334155;
      color: #ffffff;

      border: none;

      padding: 7px 10px;

      border-radius: 4px;

      font-weight: bold;
      cursor: pointer;

      font-size: 0.85rem;
    }

    .zoom-info {
      font-size: 0.75rem;
      color: var(--text-muted);

      margin-left: auto;
    }

    /* -------------------------
       Canvas
       ------------------------- */

    .canvas-container {
      position: relative;

      width: 100%;

      background: #000000;

      border-radius: 8px;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 280px;

      border: 1px solid var(--border);

      /*
       Safariでブラウザ側のジェスチャー処理と
       Canvas操作が競合しないようにする。
      */
      touch-action: none;

      overscroll-behavior: contain;
    }

    canvas {
      display: block;

      width: 100%;
      height: auto;

      max-width: 100%;

      touch-action: none;

      user-select: none;
      -webkit-user-select: none;

      cursor: crosshair;
    }

    .step-guide {
      font-size: 0.8rem;

      background: #1e293b;

      padding: 8px 12px;

      border-left: 3px solid var(--accent);
      border-radius: 4px;

      color: var(--text-muted);
    }

    .step-guide strong {
      color: var(--accent);
    }

    /* -------------------------
       SVG Viewer
       ------------------------- */

    svg {
      width: 280px;
      max-width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;

      background-color: #000000;
    }

    .viewer-panel {
      background-color: #000000;

      border: 1px solid var(--border);
      border-radius: 8px;

      padding: 12px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .viewer-header {
      width: 100%;

      display: flex;
      justify-content: space-between;

      gap: 8px;

      font-size: 0.75rem;
      color: var(--text-muted);

      margin-bottom: 8px;
    }

    /* -------------------------
       小さいiPhone
       ------------------------- */

    @media (max-width: 430px) {

      body {
        padding-left: max(8px, env(safe-area-inset-left));
        padding-right: max(8px, env(safe-area-inset-right));
      }

      .container {
        padding: 14px;
      }

      h1 {
        font-size: 1.1rem;
      }

      .tab-btn {
        font-size: 0.78rem;
      }

      .grid-inputs {
        gap: 8px;
      }

      .results-row {
        gap: 8px;
      }

      .zoom-info {
        width: 100%;
        margin-left: 0;
        text-align: center;
      }
    }
  </style>
</head>


<body>

<div class="container">

  <h1>THA カップ設置角・透視写真計測</h1>

  <p class="subtitle">
    拡大ズーム ＋ 基準線補正 ＋ 楕円幾何計測
  </p>


  <!-- =========================
       TAB
       ========================= -->

  <div class="tab-container">

    <button
      id="measureTabButton"
      class="tab-btn active"
      type="button">
      📷 写真から角度計測
    </button>

    <button
      id="simulateTabButton"
      class="tab-btn"
      type="button">

    </button>

  </div>


  <!-- =========================
       TAB 1
       写真計測
       ========================= -->

  <div id="tab-measure" class="tab-content active">

    <div class="photo-area">

      <div class="file-input-wrapper">

        <label
          class="btn-action"

    <div class="grid-inputs">

      <div class="input-group">

      <svg

        <path

        <ellipse

      <div

    </div>

  </div>

</div>


<script>
"use strict";

/* =========================================================
   基本DOM
   ========================================================= */

const measureTabButton =
  document.getElementById("measureTabButton");

const simulateTabButton =
  document.getElementById("simulateTabButton");

const measureTab =
  document.getElementById("tab-measure");

const simulateTab =
  document.getElementById("tab-simulate");


/* =========================================================
   TAB
   ========================================================= */

function switchTab(tabName) {

  measureTabButton.classList.remove("active");
  simulateTabButton.classList.remove("active");

  measureTab.classList.remove("active");
  simulateTab.classList.remove("active");

  if (tabName === "measure") {

    measureTabButton.classList.add("active");
    measureTab.classList.add("active");

  } else {

    simulateTabButton.classList.add("active");
    simulateTab.classList.add("active");

    updateSim();
  }
}


measureTabButton.addEventListener("click", function () {
  switchTab("measure");
});


simulateTabButton.addEventListener("click", function () {
  switchTab("simulate");
});


/* =========================================================
   Canvas
   ========================================================= */

const fileInput =
  document.getElementById("cameraInput");

const canvas =
  document.getElementById("photoCanvas");

const ctx =
  canvas.getContext("2d");

const guideText =
  document.getElementById("guideText");

const zoomLevelDisp =
  document.getElementById("zoomLevel");

const measuredIncDisp =
  document.getElementById("measuredInc");

const measuredAnteDisp =
  document.getElementById("measuredAnte");


/* =========================================================
   画像
   ========================================================= */

let img = new Image();

let currentObjectURL = null;

let imageLoaded = false;


/*
 iPhoneの写真は非常に巨大なことがあるため、
 Canvas内部画像を適度に縮小する。

 計測は比率・角度なので、
 等方的縮小なら計測値に影響しない。
*/

const MAX_IMAGE_DIMENSION = 1800;


/* =========================================================
   計測点
   ========================================================= */

let points = [];

let draggingIdx = -1;


const pointMeta = [

  {
    label: "H1",
    color: "#10b981"
  },

  {
    label: "H2",
    color: "#10b981"
  },

  {
    label: "A",
    color: "#ef4444"
  },

  {
    label: "B",
    color: "#ef4444"
  },

  {
    label: "C",
    color: "#38bdf8"
  },

  {
    label: "D",
    color: "#38bdf8"
  }

];


/* =========================================================
   Zoom / Pan
   ========================================================= */

let scale = 1.0;

let panX = 0;
let panY = 0;

const MIN_SCALE = 1.0;
const MAX_SCALE = 6.0;


/* =========================================================
   Pointer管理
   ========================================================= */

const activePointers = new Map();

let pinchStartDistance = 0;
let pinchStartScale = 1;

let pinchStartMidX = 0;
let pinchStartMidY = 0;

let pinchStartPanX = 0;
let pinchStartPanY = 0;


/* =========================================================
   初期Canvas
   ========================================================= */

function initializeCanvas() {

  canvas.width = 540;
  canvas.height = 360;

  imageLoaded = false;

  redraw();
}


initializeCanvas();


/* =========================================================
   写真選択
   ========================================================= */

fileInput.addEventListener("change", function (event) {

  const file =
    event.target.files &&
    event.target.files[0];

  if (!file) {
    return;
  }


  /*
   前のObject URLを解放
  */

  if (currentObjectURL) {

    URL.revokeObjectURL(currentObjectURL);

    currentObjectURL = null;
  }


  currentObjectURL =
    URL.createObjectURL(file);


  const newImage =
    new Image();


  newImage.onload = function () {

    img = newImage;

    imageLoaded = true;

    setupCanvasFromImage();

    resetPoints();

    resetZoom();


    /*
     読み込み後にObject URLを解放しても
     Image自体は使用できる。
    */

    if (currentObjectURL) {

      URL.revokeObjectURL(currentObjectURL);

      currentObjectURL = null;
    }
  };


  newImage.onerror = function () {

    alert(
      "画像を読み込めませんでした。JPEGまたはPNG画像で再度お試しください。"
    );

    imageLoaded = false;

    initializeCanvas();
  };


  newImage.src =
    currentObjectURL;
});


/* =========================================================
   Canvasサイズ設定
   ========================================================= */

function setupCanvasFromImage() {

  if (
    !img ||
    !img.naturalWidth ||
    !img.naturalHeight
  ) {

    initializeCanvas();

    return;
  }


  const naturalWidth =
    img.naturalWidth;

  const naturalHeight =
    img.naturalHeight;


  const largestDimension =
    Math.max(
      naturalWidth,
      naturalHeight
    );


  const resizeScale =
    Math.min(
      1,
      MAX_IMAGE_DIMENSION / largestDimension
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        naturalWidth * resizeScale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        naturalHeight * resizeScale
      )
    );


  redraw();
}


/* =========================================================
   点リセット
   ========================================================= */

function resetPoints() {

  points = [];

  draggingIdx = -1;

  measuredIncDisp.textContent =
    "--";

  measuredAnteDisp.textContent =
    "--";

  updateGuide();

  redraw();
}


document
  .getElementById("resetPointsButton")
  .addEventListener(
    "click",
    resetPoints
  );


/* =========================================================
   Zoom
   ========================================================= */

function adjustZoom(factor) {

  const oldScale =
    scale;


  const newScale =
    Math.min(
      MAX_SCALE,
      Math.max(
        MIN_SCALE,
        oldScale * factor
      )
    );


  if (newScale === oldScale) {
    return;
  }


  /*
   Canvas中央をズーム中心にする
  */

  const centerX =
    canvas.width / 2;

  const centerY =
    canvas.height / 2;


  const imageX =
    (centerX - panX) /
    oldScale;

  const imageY =
    (centerY - panY) /
    oldScale;


  scale =
    newScale;


  panX =
    centerX -
    imageX * scale;

  panY =
    centerY -
    imageY * scale;


  clampPan();

  updateZoomDisplay();

  redraw();
}


function resetZoom() {

  scale = 1.0;

  panX = 0;
  panY = 0;

  updateZoomDisplay();

  redraw();
}


function updateZoomDisplay() {

  zoomLevelDisp.textContent =
    "倍率: " +
    scale.toFixed(1) +
    "x";
}


/* =========================================================
   Pan制限
   ========================================================= */

function clampPan() {

  if (scale <= 1) {

    panX = 0;
    panY = 0;

    return;
  }


  const minX =
    canvas.width *
    (1 - scale);

  const minY =
    canvas.height *
    (1 - scale);


  panX =
    Math.min(
      0,
      Math.max(
        minX,
        panX
      )
    );


  panY =
    Math.min(
      0,
      Math.max(
        minY,
        panY
      )
    );
}

/* =========================================================
   座標変換
   ========================================================= */

function clientToCanvasCoords(
  clientX,
  clientY
) {

  const rect =
    canvas.getBoundingClientRect();


  return {

    x:
      (clientX - rect.left) *
      (canvas.width / rect.width),

    y:
      (clientY - rect.top) *
      (canvas.height / rect.height)

  };
}


function screenToImageCoords(
  screenX,
  screenY
) {

  return {

    x:
      (screenX - panX) /
      scale,

    y:
      (screenY - panY) /
      scale

  };
}


/* =========================================================
   Pointer utility
   ========================================================= */

function getPointerDistance(
  p1,
  p2
) {

  return Math.hypot(
    p2.x - p1.x,
    p2.y - p1.y
  );
}


function getPointerMidpoint(
  p1,
  p2
) {

  return {

    x:
      (p1.x + p2.x) / 2,

    y:
      (p1.y + p2.y) / 2

  };
}


/* =========================================================
   Pointer Down
   ========================================================= */

function handlePointerDown(event) {

  if (!imageLoaded) {
    return;
  }


  event.preventDefault();


  try {

    canvas.setPointerCapture(
      event.pointerId
    );

  } catch (error) {

    /*
     古いSafariなどで失敗しても
     処理継続
    */

  }


  const pos =
    clientToCanvasCoords(
      event.clientX,
      event.clientY
    );


  activePointers.set(
    event.pointerId,
    pos
  );


  /*
   2本指になったら
   pinch開始
  */

  if (
    activePointers.size === 2
  ) {

    draggingIdx = -1;


    const pointerArray =
      Array.from(
        activePointers.values()
      );


    const p1 =
      pointerArray[0];

    const p2 =
      pointerArray[1];


    pinchStartDistance =
      getPointerDistance(
        p1,
        p2
      );


    pinchStartScale =
      scale;


    const mid =
      getPointerMidpoint(
        p1,
        p2
      );


    pinchStartMidX =
      mid.x;

    pinchStartMidY =
      mid.y;


    pinchStartPanX =
      panX;

    pinchStartPanY =
      panY;


    return;
  }


  /*
   1本指の場合
  */

  if (
    activePointers.size !== 1
  ) {

    return;
  }


  const screenX =
    pos.x;

  const screenY =
    pos.y;


  /*
   既存点に近いか判定。

   表示上約30px程度を狙えるように
   CSSピクセルとの比率を考慮。
  */

  const rect =
    canvas.getBoundingClientRect();


  const cssToCanvas =
    canvas.width /
    rect.width;


  const hitRadius =
    30 *
    cssToCanvas;


  let nearestIdx =
    -1;

  let minDist =
    hitRadius;


  for (
    let i = 0;
    i < points.length;
    i++
  ) {

    const pointScreenX =
      points[i].x *
      scale +
      panX;


    const pointScreenY =
      points[i].y *
      scale +
      panY;


    const distance =
      Math.hypot(
        pointScreenX -
        screenX,

        pointScreenY -
        screenY
      );


    if (
      distance <
      minDist
    ) {

      minDist =
        distance;

      nearestIdx =
        i;
    }
  }


  /*
   既存点ドラッグ
  */

  if (
    nearestIdx !== -1
  ) {

    draggingIdx =
      nearestIdx;

    redraw();

    return;
  }


  /*
   新規打点
  */

  if (
    points.length < 6
  ) {

    const imagePos =
      screenToImageCoords(
        screenX,
        screenY
      );


    points.push({

      x:
        Math.max(
          0,
          Math.min(
            canvas.width,
            imagePos.x
          )
        ),

      y:
        Math.max(
          0,
          Math.min(
            canvas.height,
            imagePos.y
          )
        )

    });


    updateGuide();


    if (
      points.length === 6
    ) {

      calculateMeasuredAngles();

    }


    redraw();
  }
}


/* =========================================================
   Pointer Move
   ========================================================= */

function handlePointerMove(event) {

  if (
    !activePointers.has(
      event.pointerId
    )
  ) {

    return;
  }


  event.preventDefault();


  const pos =
    clientToCanvasCoords(
      event.clientX,
      event.clientY
    );


  activePointers.set(
    event.pointerId,
    pos
  );


  /*
   2本指：
   pinch + pan
  */

  if (
    activePointers.size === 2
  ) {

    const pointerArray =
      Array.from(
        activePointers.values()
      );


    const p1 =
      pointerArray[0];

    const p2 =
      pointerArray[1];


    const distance =
      getPointerDistance(
        p1,
        p2
      );


    const mid =
      getPointerMidpoint(
        p1,
        p2
      );


    if (
      pinchStartDistance > 0
    ) {

      const scaleFactor =
        distance /
        pinchStartDistance;


      const newScale =
        Math.min(
          MAX_SCALE,
          Math.max(
            MIN_SCALE,
            pinchStartScale *
            scaleFactor
          )
        );


      /*
       pinch開始時の中心位置にあった
       画像座標を求める
      */

      const imageAnchorX =
        (
          pinchStartMidX -
          pinchStartPanX
        ) /
        pinchStartScale;


      const imageAnchorY =
        (
          pinchStartMidY -
          pinchStartPanY
        ) /
        pinchStartScale;


      scale =
        newScale;


      /*
       現在の指の中心が
       同じ画像位置を指すようにする
      */

      panX =
        mid.x -
        imageAnchorX *
        scale;


      panY =
        mid.y -
        imageAnchorY *
        scale;


      clampPan();

      updateZoomDisplay();

      redraw();
    }


    return;
  }


  /*
   1本指：
   点ドラッグ
  */

  if (
    activePointers.size === 1 &&
    draggingIdx !== -1
  ) {

    const imagePos =
      screenToImageCoords(
        pos.x,
        pos.y
      );


    points[draggingIdx].x =
      Math.max(
        0,
        Math.min(
          canvas.width,
          imagePos.x
        )
      );


    points[draggingIdx].y =
      Math.max(
        0,
        Math.min(
          canvas.height,
          imagePos.y
        )
      );


    if (
      points.length === 6
    ) {

      calculateMeasuredAngles();

    }


    redraw();
  }
}


/* =========================================================
   Pointer Up
   ========================================================= */

function handlePointerEnd(event) {

  activePointers.delete(
    event.pointerId
  );


  draggingIdx =
    -1;


  if (
    activePointers.size < 2
  ) {

    pinchStartDistance =
      0;
  }


  try {

    if (
      canvas.hasPointerCapture &&
      canvas.hasPointerCapture(
        event.pointerId
      )
    ) {

      canvas.releasePointerCapture(
        event.pointerId
      );

    }

  } catch (error) {

    /*
     Safari対策
    */

  }


  redraw();
}


/* =========================================================
   Pointer Events
   ========================================================= */

canvas.addEventListener(
  "pointerdown",
  handlePointerDown,
  {
    passive: false
  }
);


canvas.addEventListener(
  "pointermove",
  handlePointerMove,
  {
    passive: false
  }
);


canvas.addEventListener(
  "pointerup",
  handlePointerEnd,
  {
    passive: false
  }
);


canvas.addEventListener(
  "pointercancel",
  handlePointerEnd,
  {
    passive: false
  }
);


canvas.addEventListener(
  "lostpointercapture",
  function (event) {

    activePointers.delete(
      event.pointerId
    );

    draggingIdx =
      -1;

    pinchStartDistance =
      0;

    redraw();

  }
);


/* =========================================================
   PCマウスホイールZoom
   ========================================================= */

canvas.addEventListener(
  "wheel",
  function (event) {

    event.preventDefault();


    const factor =
      event.deltaY < 0
        ? 1.15
        : 0.87;


    /*
     マウスポインタを中心に
     ズーム
    */

    const mouse =
      clientToCanvasCoords(
        event.clientX,
        event.clientY
      );


    const oldScale =
      scale;


    const newScale =
      Math.min(
        MAX_SCALE,
        Math.max(
          MIN_SCALE,
          oldScale *
          factor
        )
      );


    if (
      newScale === oldScale
    ) {

      return;
    }


    const imageX =
      (
        mouse.x -
        panX
      ) /
      oldScale;


    const imageY =
      (
        mouse.y -
        panY
      ) /
      oldScale;


    scale =
      newScale;


    panX =
      mouse.x -
      imageX *
      scale;


    panY =
      mouse.y -
      imageY *
      scale;


    clampPan();

    updateZoomDisplay();

    redraw();

  },
  {
    passive: false
  }
);


/* =========================================================
   ガイド
   ========================================================= */

function updateGuide() {

  const count =
    points.length;


  if (count === 0) {

    guideText.innerHTML =
      '1. <strong>基準水平線の端点 H1</strong>（涙滴線等）をタップ';

  } else if (count === 1) {

    guideText.innerHTML =
      '2. <strong>基準水平線の反対側 H2</strong> をタップ';

  } else if (count === 2) {

    guideText.innerHTML =
      '3. <strong>カップ長軸の端点 A</strong> をタップ';

  } else if (count === 3) {

    guideText.innerHTML =
      '4. <strong>カップ長軸の反対側 B</strong> をタップ';

  } else if (count === 4) {

    guideText.innerHTML =
      '5. <strong>カップ短軸の端点 C</strong> をタップ';

  } else if (count === 5) {

    guideText.innerHTML =
      '6. <strong>カップ短軸の反対側 D</strong> をタップ';

  } else {

    guideText.innerHTML =
      '✅ <strong>計測完了</strong>（各点をドラッグ微調整可）';

  }
}


/* =========================================================
   再描画
   ========================================================= */

function redraw() {

  ctx.setTransform(
    1,
    0,
    0,
    1,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
   画像未読み込み
  */

  if (!imageLoaded) {

    ctx.fillStyle =
      "#1e293b";


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.fillStyle =
      "#94a3b8";


    ctx.font =
      "16px -apple-system, sans-serif";


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "middle";


    ctx.fillText(
      "写真を撮影または選択してください",
      canvas.width / 2,
      canvas.height / 2
    );


    return;
  }


  ctx.save();


  ctx.translate(
    panX,
    panY
  );


  ctx.scale(
    scale,
    scale
  );


  /* -------------------------
     画像
     ------------------------- */

  ctx.drawImage(
    img,
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* -------------------------
     H1-H2
     ------------------------- */

  if (
    points.length >= 2
  ) {

    ctx.strokeStyle =
      "#10b981";


    ctx.lineWidth =
      2.5 /
      scale;


    ctx.beginPath();


    ctx.moveTo(
      points[0].x,
      points[0].y
    );


    ctx.lineTo(
      points[1].x,
      points[1].y
    );


    ctx.stroke();


    const dxH =
      points[1].x -
      points[0].x;


    const dyH =
      points[1].y -
      points[0].y;


    ctx.strokeStyle =
      "rgba(16,185,129,0.45)";


    ctx.lineWidth =
      1.5 /
      scale;


    ctx.setLineDash([
      5 / scale,
      5 / scale
    ]);


    ctx.beginPath();


    ctx.moveTo(
      points[0].x -
      dxH * 2,

      points[0].y -
      dyH * 2
    );


    ctx.lineTo(
      points[1].x +
      dxH * 2,

      points[1].y +
      dyH * 2
    );


    ctx.stroke();


    ctx.setLineDash([]);
  }


  /* -------------------------
     長軸 A-B
     ------------------------- */

  if (
    points.length >= 4
  ) {

    ctx.strokeStyle =
      "#ef4444";


    ctx.lineWidth =
      2.5 /
      scale;


    ctx.beginPath();


    ctx.moveTo(
      points[2].x,
      points[2].y
    );


    ctx.lineTo(
      points[3].x,
      points[3].y
    );


    ctx.stroke();
  }


  /* -------------------------
     短軸 C-D
     ------------------------- */

  if (
    points.length === 6
  ) {

    ctx.strokeStyle =
      "#38bdf8";


    ctx.lineWidth =
      2.5 /
      scale;


    ctx.beginPath();


    ctx.moveTo(
      points[4].x,
      points[4].y
    );


    ctx.lineTo(
      points[5].x,
      points[5].y
    );


    ctx.stroke();


    /* -------------------------
       楕円
       ------------------------- */

    const midX =
      (
        points[2].x +
        points[3].x
      ) /
      2;


    const midY =
      (
        points[2].y +
        points[3].y
      ) /
      2;


    const majorLen =
      Math.hypot(
        points[3].x -
        points[2].x,

        points[3].y -
        points[2].y
      );


    const minorLen =
      Math.hypot(
        points[5].x -
        points[4].x,

        points[5].y -
        points[4].y
      );


    const angle =
      Math.atan2(
        points[3].y -
        points[2].y,

        points[3].x -
        points[2].x
      );


    if (
      majorLen > 0 &&
      minorLen > 0
    ) {

      ctx.save();


      ctx.translate(
        midX,
        midY
      );


      ctx.rotate(
        angle
      );


      ctx.strokeStyle =
        "rgba(56,189,248,0.85)";


      ctx.lineWidth =
        2 /
        scale;


      ctx.setLineDash([
        5 / scale,
        5 / scale
      ]);


      ctx.beginPath();


      ctx.ellipse(
        0,
        0,

        majorLen / 2,
        minorLen / 2,

        0,
        0,
        Math.PI * 2
      );


      ctx.stroke();


      ctx.restore();
    }
  }


  /* -------------------------
     点
     ------------------------- */

  points.forEach(
    function (point, index) {

      const meta =
        pointMeta[index];


      /*
       拡大してもマーカーが
       極端に大きくならないようにする
      */

      const radius =
        (
          index === draggingIdx
            ? 9
            : 7
        ) /
        scale;


      ctx.fillStyle =
        meta.color;


      ctx.beginPath();


      ctx.arc(
        point.x,
        point.y,
        radius,
        0,
        Math.PI * 2
      );


      ctx.fill();


      ctx.strokeStyle =
        "#ffffff";


      ctx.lineWidth =
        2 /
        scale;


      ctx.stroke();


      /*
       ラベル
      */

      ctx.fillStyle =
        "#ffffff";


      ctx.font =
        "bold " +
        (
          13 /
          scale
        ) +
        "px -apple-system, sans-serif";


      ctx.textAlign =
        "left";


      ctx.textBaseline =
        "alphabetic";


      ctx.fillText(
        meta.label,

        point.x +
        9 / scale,

        point.y -
        9 / scale
      );

    }
  );


  ctx.restore();
}


/* =========================================================
   計測
   ========================================================= */

function calculateMeasuredAngles() {

  if (
    points.length !== 6
  ) {

    return;
  }


  const pH1 =
    points[0];

  const pH2 =
    points[1];

  const pA =
    points[2];

  const pB =
    points[3];

  const pC =
    points[4];

  const pD =
    points[5];


  /* -------------------------
     基準線角度
     ------------------------- */

  const angleRef =
    Math.atan2(
      pH2.y -
      pH1.y,

      pH2.x -
      pH1.x
    );


  /* -------------------------
     Cup長軸角度
     ------------------------- */

  const angleCup =
    Math.atan2(
      pB.y -
      pA.y,

      pB.x -
      pA.x
    );


  let deltaAngle =
    Math.abs(
      angleCup -
      angleRef
    ) *
    180 /
    Math.PI;


  /*
   線には方向がないため
   0～90°に正規化
  */

  deltaAngle =
    deltaAngle %
    180;


  if (
    deltaAngle > 90
  ) {

    deltaAngle =
      180 -
      deltaAngle;
  }


  /* -------------------------
     長軸・短軸
     ------------------------- */

  const majorLen =
    Math.hypot(
      pB.x -
      pA.x,

      pB.y -
      pA.y
    );


  const minorLen =
    Math.hypot(
      pD.x -
      pC.x,

      pD.y -
      pC.y
    );


  if (
    majorLen <= 0
  ) {

    measuredIncDisp.textContent =
      "--";

    measuredAnteDisp.textContent =
      "--";

    return;
  }


  /*
   ratio > 1 になった場合は
   数値エラーを避けるため1に制限
  */

  const ratio =
    Math.min(
      1,
      Math.max(
        0,
        minorLen /
        majorLen
      )
    );


  /*
   RA = asin(b/a)
  */

  const anteDeg =
    Math.asin(
      ratio
    ) *
    180 /
    Math.PI;


  measuredIncDisp.textContent =
    deltaAngle.toFixed(1);


  measuredAnteDisp.textContent =
    anteDeg.toFixed(1);
}


/* =========================================================
   Simulator
   ========================================================= */

let currentSide =
  "right";


const stemInput =
  document.getElementById("stemAnte");

const ptInput =
  document.getElementById("deltaPT");

const incInput =
  document.getElementById("cupInc");


const targetCupAnteDisp =
  document.getElementById("targetCupAnte");

const apparentIncDisp =
  document.getElementById("apparentInc");

const viewSideLabel =
  document.getElementById("viewSideLabel");

const ellipseParamsDisp =
  document.getElementById("ellipseParams");

const cupEllipse =
  document.getElementById("cupEllipse");

const majorAxisLine =
  document.getElementById("majorAxisLine");

const cupDome =
  document.getElementById("cupDome");


/* =========================================================
   左右
   ========================================================= */

function setSide(side) {

  currentSide =
    side;


  document
    .getElementById("btnRight")
    .classList.toggle(
      "active",
      side === "right"
    );


  document
    .getElementById("btnLeft")

    );

    "イメージ正面像: " +
    (
      side === "right"
        ? "右股関節"
        : "左股関節"
    );


  updateSim();
}


document

    "click",

    }
  );


document

    }
  );


/* =========================================================
   Simulator計算
   ========================================================= */

function updateSim() {

  let vStem =
    parseFloat(
      stemInput.value
    );


  let deltaPT =
    parseFloat(
      ptInput.value
    );


  let inc =
    parseFloat(
      incInput.value
    );


  if (
    !Number.isFinite(vStem)
  ) {

    vStem = 0;
  }


  if (
    !Number.isFinite(deltaPT)
  ) {

    deltaPT = 0;
  }


  if (
    !Number.isFinite(inc)
  ) {

    inc = 40;
  }


  /* -------------------------
     Widmer + PT補正
     ------------------------- */

  const vCup =
    37.3 -
    0.7 *
    vStem -
    deltaPT /
    2.0;


  targetCupAnteDisp.textContent =
    vCup.toFixed(1);


  /* -------------------------
     幾何
     ------------------------- */

  const incRad =
    inc *
    Math.PI /
    180;


  /*
   SVG表示上は負の前捻で
   楕円が反転しないように0°で制限。

   数値としてのvCupは上にそのまま表示。
  */

  const visualAnte =
    Math.max(
      0,
      Math.min(
        90,
        vCup
      )
    );


  const anteRad =
    visualAnte *
    Math.PI /
    180;


  const a =
    85;


  const b =
    a *
    Math.sin(
      anteRad
    );


  const tanApparent =
    Math.tan(
      incRad
    ) *
    Math.cos(
      anteRad
    );


  const apparentIncDeg =
    Math.atan(
      tanApparent
    ) *
    180 /
    Math.PI;


  apparentIncDisp.textContent =
    apparentIncDeg.toFixed(1);


  /* -------------------------
     左右反転
     ------------------------- */

  const rotAngle =
    currentSide === "right"
      ? apparentIncDeg
      : -apparentIncDeg;


  /* -------------------------
     楕円
     ------------------------- */

  cupEllipse.setAttribute(
    "rx",
    a
  );


  cupEllipse.setAttribute(
    "ry",
    Math.abs(b)
  );


  cupEllipse.setAttribute(
    "transform",
    "rotate(" +
    rotAngle +
    ")"
  );


  /* -------------------------
     長軸
     ------------------------- */

  majorAxisLine.setAttribute(
    "x1",
    -a
  );


  majorAxisLine.setAttribute(
    "x2",
    a
  );


  majorAxisLine.setAttribute(
    "transform",
    "rotate(" +
    rotAngle +
    ")"
  );


  /* -------------------------
     Dome
     ------------------------- */

  const domePath =
    "M " +
    (-a) +
    " 0 " +
    "A " +
    a +
    " " +
    a +
    " 0 0 1 " +
    a +
    " 0 Z";


  cupDome.setAttribute(
    "d",
    domePath
  );


  cupDome.setAttribute(
    "transform",
    "rotate(" +
    rotAngle +
    ")"
  );


  /* -------------------------
     表示
     ------------------------- */

  ellipseParamsDisp.textContent =
    "短長軸比(b/a): " +
    Math.sin(
      anteRad
    ).toFixed(2) +
    " | 開口長軸傾斜: " +
    rotAngle.toFixed(1) +
    "°";
}


/* =========================================================
   Simulator Event
   ========================================================= */

stemInput.addEventListener(
  "input",
  updateSim
);


ptInput.addEventListener(
  "input",
  updateSim
);


incInput.addEventListener(
  "input",
  updateSim
);


/* =========================================================
   初期化
   ========================================================= */

updateGuide();

updateZoomDisplay();

updateSim();

</script>

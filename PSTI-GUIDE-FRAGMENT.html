  <p>左右坐骨下部を結ぶ白い点線を基準に、恥骨結合上縁までの白い縦線の距離を病院PACSビューワーでmm単位で測定します。仰臥位と立位でそれぞれ測定し、対応する欄へ入力してください。</p>
  <p>1回モードでは各姿勢1回、3回平均モードでは各姿勢3回測定します。原著の方法は3回平均です。</p>
